<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Securexe Launcher</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div id="account-bar" class="account-bar hidden">
        <span id="account-label" class="account-label"></span>
        <button id="unlink-btn" class="unlink-btn" title="Unlink this device">Unlink</button>
      </div>

      <div id="status-banner" class="status-banner hidden">
        <span id="status-repo" class="status-repo"></span>
        <span id="status-text" class="status-text"></span>
      </div>

      <!-- Prototype-only trigger for the hosted-window mechanism (hosted.rs)
           — exercises it against a locally-built applet binary, not yet
           wired into the real install flow. Remove once this either
           becomes the real launch path or is dropped. -->
      <button id="hosted-test-btn" class="unlink-btn" style="margin: 8px 20px;">
        Test: open GIF Maker hosted
      </button>

      <p id="empty-state" class="empty-state">
        No apps yet — click Download on a project on the site.
      </p>

      <div id="gallery" class="gallery"></div>
    </main>
  </body>
</html>
