<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brightencode Launcher</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div id="account-bar" class="account-bar hidden">
        <span id="account-label" class="account-label"></span>
        <button id="unlink-btn" class="unlink-btn" title="Unlink this device">Unlink</button>
      </div>

      <div id="status-banner" class="status-banner hidden">
        <span id="status-repo" class="status-repo"></span>
        <span id="status-text" class="status-text"></span>
      </div>

      <div id="launcher-update-banner" class="launcher-update-banner hidden">
        <span id="launcher-update-text"></span>
        <button id="launcher-update-download-btn" class="unlink-btn">Update</button>
      </div>

      <div id="update-all-banner" class="launcher-update-banner hidden">
        <span id="update-all-text"></span>
        <button id="update-all-btn" class="unlink-btn">Update all</button>
      </div>

      <div class="tab-bar" role="tablist">
        <button type="button" class="tab-btn active" data-tab="my-apps" role="tab" aria-selected="true">My Apps</button>
        <button type="button" class="tab-btn" data-tab="browse" role="tab" aria-selected="false">Browse</button>
      </div>

      <input id="search-input" class="search-input" type="search" placeholder="Search" />

      <div id="my-apps-view">
        <p id="installed-empty-state" class="empty-state hidden">
          No apps yet — click Download on a project on the site to get started.
        </p>
        <div id="installed-gallery" class="gallery"></div>

        <hr class="section-divider" />

        <h2 class="section-heading">In your library</h2>
        <p id="library-note" class="section-note hidden"></p>
        <div id="library-signin-row" class="library-signin-row hidden">
          <span class="section-note">Sign in to view your online library</span>
          <button id="library-signin-btn" class="unlink-btn">Sign in</button>
        </div>
        <div id="library-gallery" class="gallery"></div>
      </div>

      <div id="browse-view" class="hidden">
        <p id="browse-empty-state" class="empty-state hidden"></p>
        <div id="browse-gallery" class="gallery"></div>
      </div>
    </main>
  </body>
</html>
