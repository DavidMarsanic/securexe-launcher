name: Release

# Builds installers for macOS (arm64 + x64), Windows, and Linux, and attaches
# them to a draft GitHub Release — draft on purpose, so a new build never
# goes live at the stable download links (see below) without a manual
# "Publish" click. Trigger by pushing a tag like `v0.1.0`, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            fixed_name: securexe-launcher-macos-arm64.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            fixed_name: securexe-launcher-macos-x64.dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            fixed_name: securexe-launcher-linux-amd64.AppImage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            fixed_name: securexe-launcher-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json/Cargo.toml both start at 0.1.0 and nothing here
      # used to bump them — every past release actually shipped with the
      # binary's own embedded version stuck at 0.1.0 regardless of which
      # tag it was built from, which is why an in-app "is a newer version
      # available" check has nothing reliable to compare against without
      # this. tagName is the source of truth (git tag, e.g. v0.1.15); this
      # writes that same number (minus the leading "v") into both files
      # before the build below reads them.
      - name: Stamp the release version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "Stamping version $version from tag $GITHUB_REF_NAME"
          python3 -c "
          import json
          path = 'src-tauri/tauri.conf.json'
          with open(path) as f:
              data = json.load(f)
          data['version'] = '$version'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$version"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          grep -n '"version"' src-tauri/tauri.conf.json
          grep -n '^version' src-tauri/Cargo.toml

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and create/update draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Brightencode Launcher ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # tauri-action uploads assets named after productName+version+arch,
      # which changes every release. We additionally upload a copy under a
      # fixed name so the website can link to a URL that never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/<fixed_name>
      - name: Also upload under a fixed, version-agnostic filename
        shell: bash
        run: |
          set -euo pipefail
          paths='${{ steps.tauri.outputs.artifactPaths }}'
          echo "Built artifacts: $paths"

          match=$(echo "$paths" | python3 -c "
          import json, sys
          paths = json.load(sys.stdin)
          ext = '${{ matrix.fixed_name }}'.rsplit('.', 1)[-1]
          for p in paths:
              if p.endswith('.' + ext):
                  print(p)
                  break
          ")

          if [ -z "$match" ]; then
            echo "No artifact matching .*.${{ matrix.fixed_name }} extension found, skipping fixed-name upload"
            exit 0
          fi

          cp "$match" "${{ matrix.fixed_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.fixed_name }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lets anyone verify a downloaded installer wasn't corrupted or
      # tampered with in transit, matching the checksum every catalog app
      # already publishes (see securexe-web's VerifyBadge/HashBubble). Pure
      # python so this works identically across bash on macOS/Linux and Git
      # Bash on Windows, same reasoning as the version-stamping step above.
      - name: Write SHA256 checksum for the fixed-name artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import hashlib
          path = '${{ matrix.fixed_name }}'
          h = hashlib.sha256()
          with open(path, 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          with open(path + '.sha256', 'w') as out:
              out.write(f'{h.hexdigest()}  {path}\n')
          "
          cat "${{ matrix.fixed_name }}.sha256"
          gh release upload "${{ github.ref_name }}" "${{ matrix.fixed_name }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stronger than the checksum above: a signed, publicly-verifiable
      # attestation tying this exact file to this exact workflow run and
      # commit — GitHub's own build-provenance tier, the same "verified"
      # bar (green check, not just a hash) that securexe-web's VerifyBadge
      # shows for a "github-attestation" download. Free on GitHub-hosted
      # runners; requires the id-token/attestations permissions above.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.fixed_name }}
